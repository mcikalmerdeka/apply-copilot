name: Deploy to Hugging Face Space

# Deploys by pushing the repo git history directly to the HF Space remote.
# - 1 commit per push (the old wipe-and-reupload script burned ~1 commit per
#   file, which trips HF's 128 commits/hour repo rate limit)
# - No destructive wipe: git push --force reconciles the Space (adds, updates,
#   AND deletes files to match this repo), so a failed run can never leave a
#   half-emptied Space behind
# - LFS objects (assets, PDFs) are uploaded automatically with the push since
#   the Space remote supports Git LFS natively

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-to-hf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          SPACE_REPO: mcikalmerdeka/apply-copilot
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@users.noreply.github.com"
          git lfs install
          git remote add space "https://user:${HF_TOKEN}@huggingface.co/spaces/${SPACE_REPO}"
          git push space main --force
          echo "Deployed to https://huggingface.co/spaces/${SPACE_REPO}"
